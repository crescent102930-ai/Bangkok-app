<!DOCTYPE html>

                extend: {

    <style>
        body { background-color: #fdf8f9; -webkit-tap-highlight-color: transparent; }

        .glass-nav { background: rgba(253, 248, 249, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(247, 214, 222, 0.5); }
        .schedule-line::before { content: ''; position: absolute; left: 19px; top: 40px; bottom: -20px; width: 2px; background: #f0b3c3; z-index: 0; opacity: 0.5; }
        .schedule-item:last-child .schedule-line::before { display: none; }
        
        /* Modal Transitions */
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease-out; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        
        /* Toast Notification */
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #d75d81; color: white; padding: 12px 24px; border-radius: 9999px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 12px rgba(215, 93, 129, 0.3); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; display: flex; align-items: center; gap: 8px; }
        #toast.show { top: 20px; }
        
        /* Loading Spinner */
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased pb-24 selection:bg-dustypink-200">

    <!-- Toast Notification -->
    <div id="toast"><i class="fa-solid fa-circle-check"></i> <span id="toast-msg">已更新</span></div>

    <!-- AI 導遊喵尼 彈跳窗 -->
    <div id="tour-guide-modal" class="modal-overlay fixed inset-0 bg-dustypink-900/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4">
        <div class="modal-content bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative max-h-[85vh] flex flex-col border border-dustypink-100">
            <button onclick="closeTourGuideModal()" class="absolute top-4 right-5 text-2xl text-dustypink-300 hover:text-dustypink-700 transition leading-none">&times;</button>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-[50px] h-[50px] flex-none drop-shadow-md" id="modal-miaoni-icon">
                    <!-- SVG injected via JS -->
                </div>
                <div>
                    <div class="text-[10px] tracking-widest text-dustypink-500 uppercase font-bold mb-0.5">AI Tour Guide</div>
                    <h3 class="font-serif text-[22px] text-dustypink-800 font-bold leading-tight">喵尼導遊 Go！</h3>
                </div>
            </div>
            <div id="tour-guide-content" class="flex-1 overflow-y-auto no-scrollbar bg-dustypink-50/70 rounded-2xl p-4 border border-dustypink-100 text-[13.5px] text-gray-700 leading-relaxed shadow-inner">
                <!-- AI Content Loading / Result -->
            </div>
        </div>
    </div>

    <!-- 上傳憑證 彈跳窗 -->
    <div id="upload-modal" class="modal-overlay fixed inset-0 bg-dustypink-900/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4">
        <div class="modal-content bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border border-dustypink-100">
            <button onclick="closeUploadModal()" class="absolute top-4 right-5 text-2xl text-dustypink-300 hover:text-dustypink-700 transition leading-none">&times;</button>
            <h3 class="font-serif text-[20px] text-dustypink-800 font-bold mb-4">☁️ 上傳雲端憑證</h3>
            <p class="text-[12px] text-gray-500 mb-4">上傳的門票或截圖會同步至雲端，同行朋友按下右上角重整即可查看。</p>
            <input type="file" id="file-upload-input" accept="image/*,application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-dustypink-50 file:text-dustypink-700 hover:file:bg-dustypink-100 mb-4 cursor-pointer">
            <button onclick="handleFileUpload()" class="w-full bg-dustypink-500 text-white rounded-xl py-3 font-bold hover:bg-dustypink-600 transition shadow-md shadow-dustypink-500/30">確認上傳</button>
        </div>
    </div>

    <!-- 頂部導覽與狀態列 -->
    <header class="glass-nav fixed top-0 w-full z-50 px-5 py-4 flex flex-col gap-2">
        <div class="flex justify-between items-start">
            <div class="flex flex-col">
                <span class="text-[10px] font-bold tracking-widest text-dustypink-500 uppercase flex items-center gap-1.5">
                    <span id="sync-status" class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75" id="sync-ping"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500" id="sync-dot"></span>
                    </span>
                    <span id="sync-text">連線中...</span>
                </span>
                <h1 class="font-serif text-3xl font-black text-gray-900 mt-1 tracking-tight">Bangkok <span class="text-dustypink-500">Journal</span></h1>
                <div class="text-[11px] text-gray-500 mt-1 font-medium flex items-center gap-1">
                    <i class="fa-solid fa-location-dot text-dustypink-400"></i> Grande Centre Point Surawong Bangkok
                </div>
            </div>
            <div class="text-right flex flex-col items-end">
                <div class="text-xs font-bold text-gray-400 mb-1">BKK Time</div>
                <div class="text-2xl font-black text-dustypink-600 tracking-tighter" id="bkk-time">00:00</div>
            </div>
        </div>
        
        <!-- 快捷功能列 -->
        <div class="flex gap-2 mt-2 overflow-x-auto no-scrollbar pb-1">
            <a href="#" class="flex-none bg-white border border-dustypink-100 px-3 py-1.5 rounded-full text-[12px] font-bold text-dustypink-600 shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-wallet"></i> 所有花費
            </a>
            <a href="#" class="flex-none bg-white border border-dustypink-100 px-3 py-1.5 rounded-full text-[12px] font-bold text-dustypink-600 shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-utensils"></i> 吃吃集合
            </a>
            <button onclick="openUploadModal()" class="flex-none bg-white border border-dustypink-100 px-3 py-1.5 rounded-full text-[12px] font-bold text-dustypink-600 shadow-sm flex items-center gap-1.5 active:scale-95 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i> 雲端憑證
            </button>
            <button onclick="forceRefresh()" class="flex-none bg-dustypink-50 border border-dustypink-200 px-3 py-1.5 rounded-full text-[12px] font-black text-dustypink-700 shadow-sm flex items-center gap-1.5 active:scale-95 transition">
                <i class="fa-solid fa-rotate" id="refresh-icon"></i> 更新同步
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="pt-[150px] px-5 max-w-lg mx-auto">
        <!-- 日期切換器 -->
        <div class="flex justify-between items-center bg-white p-1.5 rounded-2xl shadow-sm border border-dustypink-50 mb-6 relative z-10" id="day-selector">
            <!-- 由 JS 動態生成 -->
        </div>

        <!-- 動態內容容器 (天氣 + 導遊 + 行程) -->
        <div id="schedule-container" class="min-h-[500px]">
            <div class="flex justify-center items-center h-40 text-dustypink-300 flex-col gap-3">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                <span class="text-sm font-bold tracking-widest">載入雲端行程中...</span>
            </div>
        </div>
    </main>

    <!-- Firebase SDK 引入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // 用戶提供的專屬 Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyAq1YGhqmkBv-r4WjgfmHccAitV8VS0q3g",
            authDomain: "bangkok2026-ad367.firebaseapp.com",
            projectId: "bangkok2026-ad367",
            storageBucket: "bangkok2026-ad367.firebasestorage.app",
            messagingSenderId: "444288311548",
            appId: "1:444288311548:web:71666adcba178bb72fb779"
        };

        // 喵尼導遊專屬 AI 金鑰 (Gemini 1.5 Flash)
        const geminiApiKey = "AQ.Ab8RN6LM7Hu9mUPbxoeEEnLet3y-2zRlYjsCsprGW5ct7vGJhA";

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // 共享 App ID (確保所有朋友連到同一個資料庫節點)
        const appId = 'thailand-trip-2026';

        // 繪製的專屬超萌喵尼 SVG 圖示
        const miaoniSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm"><g stroke="#5c4b51" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 22 45 C 12 18, 38 24, 38 24 C 45 14, 55 14, 62 24 C 62 24, 88 18, 78 45 C 90 75, 75 92, 50 92 C 25 92, 10 75, 22 45 Z" fill="#ffffff"/><path d="M 38 22 Q 37 28 36 34 M 50 20 Q 50 26 50 32 M 62 22 Q 63 28 64 34" stroke="#b0a3a6" stroke-width="3" fill="none"/><ellipse cx="26" cy="60" rx="8.5" ry="6" fill="#ffa1b3" stroke="none"/><ellipse cx="74" cy="60" rx="8.5" ry="6" fill="#ffa1b3" stroke="none"/><path d="M 28 52 Q 32 46 36 52 M 64 52 Q 68 46 72 52" fill="none" stroke-width="4.5"/><path d="M 47 65 Q 50 70 53 65" fill="none" stroke-width="3.5"/><path d="M 30 78 Q 35 88 42 78 M 70 78 Q 65 88 58 78" fill="none" stroke-width="4"/></g></svg>`;

        // === 核心狀態變數 ===
        window.currentDay = 1;
        const totalDays = 5;
        let globalSchedules = {}; // 存放從雲端抓下來的資料
        let uploadedFiles = []; // 存放雲端憑證

        // 預設行程 (離線防呆/初次載入用)
        const defaultSchedules = {
            1: [
                { time: "09:30", title: "BKK 蘇凡納布機場", type: "transport", desc: "抵達曼谷！辦理落地簽與領行李", cost: "", note: "包車接送已預約 (Klook)" },
                { time: "11:30", title: "Grande Centre Point Surawong", type: "hotel", desc: "飯店寄放行李 & Check-in", cost: "", note: "準備護照與訂房確認信" },
                { time: "13:00", title: "朱拉隆功大學美食街", type: "food", desc: "午餐：建興酒家或在地小吃", cost: "約 ฿500/人", note: "必吃咖哩螃蟹" },
                { time: "15:30", title: "暹羅百麗宮 Siam Paragon", type: "shopping", desc: "吹冷氣逛街、超市採買", cost: "", note: "B1 Gourmet Market 買伴手禮" },
                { time: "19:00", title: "JODD FAIRS 喬德夜市", type: "spot", desc: "晚餐與逛街", cost: "約 ฿400/人", note: "火山排骨、水果冰沙" }
            ],
            2: [
                { time: "09:00", title: "Safari World 賽福瑞野生動物園", type: "spot", desc: "搭乘包車前往，看長頸鹿與表演", cost: "", note: "門票已於 KKday 購買" },
                { time: "15:00", title: "喬德夜市 神奇之地", type: "spot", desc: "充滿歐洲城堡風的新夜市", cost: "", note: "拍網美照" }
            ]
        };

        // 每日分區天氣資料 (升級為 8 小時預報模式)
        const weatherDatabase = {
            1: { area: "曼谷市區 (Pathum Wan)", currentTemp: 32, hours: [{t: "10:00", temp: 30, icon: "fa-cloud-sun"}, {t: "11:00", temp: 32, icon: "fa-sun"}, {t: "12:00", temp: 34, icon: "fa-sun"}, {t: "13:00", temp: 35, icon: "fa-sun"}, {t: "14:00", temp: 34, icon: "fa-cloud-showers-heavy"}, {t: "15:00", temp: 31, icon: "fa-cloud-rain"}, {t: "16:00", temp: 31, icon: "fa-cloud"}, {t: "17:00", temp: 30, icon: "fa-cloud-sun"}] },
            2: { area: "明武里區 (Min Buri)", currentTemp: 34, hours: [{t: "09:00", temp: 31, icon: "fa-sun"}, {t: "10:00", temp: 33, icon: "fa-sun"}, {t: "11:00", temp: 35, icon: "fa-sun"}, {t: "12:00", temp: 36, icon: "fa-sun"}, {t: "13:00", temp: 36, icon: "fa-sun"}, {t: "14:00", temp: 35, icon: "fa-cloud-sun"}, {t: "15:00", temp: 34, icon: "fa-cloud"}, {t: "16:00", temp: 32, icon: "fa-cloud"}] },
            3: { area: "舊城區 (Phra Nakhon)", currentTemp: 33, hours: [{t: "08:00", temp: 29, icon: "fa-cloud-sun"}, {t: "09:00", temp: 31, icon: "fa-sun"}, {t: "10:00", temp: 33, icon: "fa-sun"}, {t: "11:00", temp: 34, icon: "fa-sun"}, {t: "12:00", temp: 35, icon: "fa-sun"}, {t: "13:00", temp: 34, icon: "fa-cloud-showers-heavy"}, {t: "14:00", temp: 32, icon: "fa-cloud-rain"}, {t: "15:00", temp: 31, icon: "fa-cloud"}] },
            4: { area: "昭披耶河畔 (Riverside)", currentTemp: 31, hours: [{t: "14:00", temp: 33, icon: "fa-cloud"}, {t: "15:00", temp: 32, icon: "fa-cloud-rain"}, {t: "16:00", temp: 31, icon: "fa-cloud"}, {t: "17:00", temp: 30, icon: "fa-cloud-sun"}, {t: "18:00", temp: 29, icon: "fa-moon"}, {t: "19:00", temp: 28, icon: "fa-moon"}, {t: "20:00", temp: 28, icon: "fa-moon"}, {t: "21:00", temp: 27, icon: "fa-moon"}] },
            5: { area: "曼谷機場 (Suvarnabhumi)", currentTemp: 30, hours: [{t: "08:00", temp: 28, icon: "fa-cloud"}, {t: "09:00", temp: 30, icon: "fa-cloud-sun"}, {t: "10:00", temp: 31, icon: "fa-cloud-sun"}, {t: "11:00", temp: 32, icon: "fa-sun"}, {t: "12:00", temp: 33, icon: "fa-sun"}, {t: "13:00", temp: 34, icon: "fa-sun"}, {t: "14:00", temp: 33, icon: "fa-cloud-sun"}, {t: "15:00", temp: 32, icon: "fa-cloud"}] }
        };

        // 渲染日期選擇器
        function renderDaySelector() {
            const container = document.getElementById('day-selector');
            let html = '';
            for (let i = 1; i <= totalDays; i++) {
                const isActive = i === window.currentDay;
                const activeClass = isActive ? 'bg-dustypink-500 text-white shadow-md' : 'text-dustypink-400 hover:bg-dustypink-50';
                html += `<button onclick="setDay(${i})" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all duration-300 ${activeClass}">Day ${i}</button>`;
            }
            container.innerHTML = html;
        }

        window.setDay = function(day) {
            window.currentDay = day;
            renderDaySelector();
            renderSchedules();
        }

        // 渲染行程與天氣與導遊按鈕
        window.renderSchedules = function() {
            const container = document.getElementById('schedule-container');
            const schedules = globalSchedules[window.currentDay] || defaultSchedules[window.currentDay] || [];
            
            let html = '';

            // 1. 渲染每小時天氣預報卡片
            const weather = weatherDatabase[window.currentDay];
            if (weather) {
                let hourlyHtml = '';
                weather.hours.forEach(h => {
                    const isRain = h.icon.includes('rain') || h.icon.includes('showers');
                    const colorClass = isRain ? 'text-blue-400' : (h.icon.includes('sun') ? 'text-yellow-500' : 'text-gray-400');
                    hourlyHtml += `
                        <div class="flex flex-col items-center min-w-[50px] bg-white/60 rounded-xl p-2 border border-dustypink-100 shadow-sm flex-none">
                            <span class="text-[10px] font-bold text-gray-500 mb-1.5">${h.t}</span>
                            <i class="fa-solid ${h.icon} ${colorClass} text-lg mb-1"></i>
                            <span class="text-[11px] font-bold text-dustypink-700">${h.temp}°</span>
                        </div>
                    `;
                });

                html += `
                    <div class="bg-dustypink-50/80 border border-dustypink-100 rounded-2xl p-4 mb-4 shadow-sm relative overflow-hidden backdrop-blur-md">
                        <div class="text-[11px] text-dustypink-500 font-bold tracking-widest mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-location-dot"></i> <span>${weather.area}</span> <span class="text-dustypink-200">|</span> <span>每小時預報</span>
                        </div>
                        <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
                            ${hourlyHtml}
                        </div>
                    </div>
                `;
            }

            // 2. 渲染喵尼導遊按鈕
            html += `
                <button onclick="askTourGuide()" class="w-full bg-gradient-to-r from-dustypink-400 to-dustypink-500 text-white rounded-2xl p-3 mb-6 flex items-center justify-center gap-2 font-bold shadow-soft hover:shadow-lg active:scale-95 transition border border-dustypink-400">
                    <div class="w-[28px] h-[28px] flex-none drop-shadow-sm">${miaoniSVG}</div> 
                    <span class="text-[13.5px] tracking-wide text-white drop-shadow-sm">喵尼導遊 Go！解析今日行程</span>
                </button>
            `;

            // 3. 渲染雲端憑證區 (若有)
            if (uploadedFiles.length > 0) {
                html += `<div class="mb-5 bg-white p-3 rounded-2xl border border-dustypink-100 shadow-sm">
                    <div class="text-[11px] font-bold text-dustypink-600 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-cloud"></i> 共用雲端憑證</div>
                    <div class="flex flex-col gap-2">`;
                uploadedFiles.forEach(file => {
                    html += `
                        <a href="${file.url}" target="_blank" class="flex items-center justify-between bg-dustypink-50 p-2 rounded-xl text-[12px] text-dustypink-700 hover:bg-dustypink-100 transition">
                            <span class="truncate pr-2 font-medium"><i class="fa-regular fa-file-lines mr-1"></i> ${file.name}</span>
                            <span class="flex-none bg-white px-2 py-1 rounded-lg shadow-sm font-bold text-[10px]">查看</span>
                        </a>`;
                });
                html += `</div></div>`;
            }

            // 4. 渲染行程清單
            if (schedules.length === 0) {
                html += `<div class="text-center text-dustypink-300 py-10 font-medium text-sm border-2 border-dashed border-dustypink-100 rounded-2xl bg-white/50">今日無行程，點擊右下角新增。</div>`;
            } else {
                html += `<div class="relative">`;
                schedules.forEach((item, index) => {
                    const icons = { 'food': 'fa-utensils bg-orange-100 text-orange-500', 'spot': 'fa-camera-retro bg-blue-100 text-blue-500', 'shopping': 'fa-bag-shopping bg-pink-100 text-pink-500', 'transport': 'fa-plane bg-teal-100 text-teal-500', 'hotel': 'fa-bed bg-lavender-100 text-lavender-600' };
                    const iconConfig = icons[item.type] || 'fa-map-pin bg-gray-100 text-gray-500';
                    
                    html += `
                        <div class="schedule-item schedule-line relative pl-[45px] pb-6 last:pb-2">
                            <div class="absolute left-0 top-1 w-10 h-10 rounded-full flex items-center justify-center z-10 shadow-sm border border-white ${iconConfig}">
                                <i class="fa-solid ${iconConfig.split(' ')[0]}"></i>
                            </div>
                            <div class="bg-white rounded-2xl p-4 shadow-sm border border-dustypink-50 relative">
                                <div class="text-[12px] font-black text-dustypink-500 mb-1 font-sans tracking-wide">${item.time}</div>
                                <h3 class="text-[16px] font-bold text-gray-800 mb-1.5 leading-tight">${item.title}</h3>
                                <p class="text-[13px] text-gray-500 leading-snug mb-2">${item.desc}</p>
                                ${item.cost ? `<div class="inline-block bg-green-50 text-green-600 text-[11px] font-bold px-2 py-1 rounded-lg mb-2 mr-1"><i class="fa-solid fa-coins"></i> ${item.cost}</div>` : ''}
                                ${item.note ? `<div class="text-[11.5px] text-dustypink-600 bg-dustypink-50/50 p-2 rounded-xl mt-1"><i class="fa-solid fa-circle-info mr-1"></i> ${item.note}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        window.forceRefresh = function() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('spin-anim');
            showToast('🔄 正在同步雲端最新資料...');
            setTimeout(() => {
                icon.classList.remove('spin-anim');
                renderSchedules(); // Re-render to ensure latest
            }, 1000);
        }

        // BKK Time Updater
        setInterval(() => {
            const options = { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false };
            document.getElementById('bkk-time').innerText = new Intl.DateTimeFormat('en-US', options).format(new Date());
        }, 1000);

        // Modals
        window.closeTourGuideModal = function() { document.getElementById('tour-guide-modal').classList.remove('active'); }
        window.openUploadModal = function() { document.getElementById('upload-modal').classList.add('active'); }
        window.closeUploadModal = function() { document.getElementById('upload-modal').classList.remove('active'); document.getElementById('file-upload-input').value = ''; }

        // 注入喵尼圖標到彈窗
        document.addEventListener('DOMContentLoaded', () => {
            const iconContainer = document.getElementById('modal-miaoni-icon');
            if(iconContainer) iconContainer.innerHTML = miaoniSVG;
        });

        // 初始化 Firebase 連線
        async function initApp() {
            try {
                // 1. 匿名登入 (取得權限)
                await signInAnonymously(auth);
                
                // 狀態燈：綠燈
                document.getElementById('sync-dot').classList.replace('bg-yellow-500', 'bg-green-500');
                document.getElementById('sync-ping').classList.replace('bg-yellow-400', 'bg-green-400');
                document.getElementById('sync-text').innerText = '已連線';
                document.getElementById('sync-text').classList.add('text-green-500');
                document.getElementById('sync-text').classList.remove('text-dustypink-500');

                // 2. 載入並監聽公開行程資料 (確保朋友間看到一樣的)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().schedules) {
                        globalSchedules = docSnap.data().schedules;
                    } else {
                        // 雲端無資料，上傳預設資料
                        globalSchedules = defaultSchedules;
                        setDoc(docRef, { schedules: defaultSchedules }, { merge: true });
                    }
                    renderSchedules();
                }, (error) => {
                    console.error("Firestore error:", error);
                    globalSchedules = defaultSchedules; // Fallback
                    renderSchedules();
                });

                // 3. 載入並監聽雲端憑證
                const vouchersRef = collection(db, 'artifacts', appId, 'public', 'vouchers');
                onSnapshot(vouchersRef, (snapshot) => {
                    uploadedFiles = [];
                    snapshot.forEach(doc => uploadedFiles.push(doc.data()));
                    renderSchedules(); // 重新渲染以顯示憑證
                });

            } catch (error) {
                console.error("Auth error:", error);
                document.getElementById('sync-text').innerText = '連線異常';
                document.getElementById('sync-dot').classList.replace('bg-yellow-500', 'bg-red-500');
                globalSchedules = defaultSchedules; // 離線防呆
                renderSchedules();
            }
        }

        // 啟動 App
        renderDaySelector();
        initApp();

        window.handleFileUpload = async function() {
            const fileInput = document.getElementById('file-upload-input');
            const file = fileInput.files[0];
            if (!file) return alert('請先選擇檔案');
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = '☁️ 上傳中...';
            btn.disabled = true;

            try {
                // 上傳至 Firebase Storage
                const storageRef = ref(storage, `artifacts/${appId}/public/vouchers/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(storageRef);

                // 將網址寫入 Firestore
                const docRef = doc(collection(db, 'artifacts', appId, 'public', 'vouchers'));
                await setDoc(docRef, {
                    name: file.name,
                    url: downloadURL,
                    timestamp: Date.now()
                });

                showToast('憑證已同步至雲端！');
                closeUploadModal();
            } catch (e) {
                console.error("上傳失敗", e);
                alert('上傳失敗，請檢查網路或 Firebase Storage 權限 (需為測試模式)');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        window.askTourGuide = async function() {
            document.getElementById('tour-guide-modal').classList.add('active');
            const contentDiv = document.getElementById('tour-guide-content');
            
            // 跳動的喵尼讀取畫面
            contentDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-48 text-center">
                    <div class="w-[75px] h-[75px] mb-4 animate-bounce mx-auto drop-shadow-lg">${miaoniSVG}</div>
                    <div class="text-[13px] font-bold text-dustypink-600 mb-1">喵尼正在幫您掃描行程...</div>
                    <div class="text-[11px] text-gray-400">正在整理必吃、必買與景點故事！<br>請稍候約 3~5 秒鐘 ⏳</div>
                </div>
            `;

            const schedules = globalSchedules[window.currentDay] || [];
            if (schedules.length === 0) {
                contentDiv.innerHTML = `<div class="text-center text-dustypink-500 py-10 font-bold">喵尼說：今日還沒有安排行程喔！先去加點好玩的吧！</div>`;
                return;
            }

            const prompt = `你是一個在泰國曼谷非常專業、熱情、語氣可愛的導遊(叫做喵尼)。
            請根據以下我今天的行程表，用繁體中文，以 HTML 格式給我一段簡短的推薦。
            包含：1. 行程中的歷史小知識(1段)。 2. 附近推薦必吃美食(2項)。 3. 推薦必買伴手禮(1項)。
            不要使用 markdown 語法，直接回傳帶有基本樣式 (如 <b>, <ul>, <li>, <br>, <span style="color: #d75d81">) 的 HTML 字串即可，版面要簡潔好讀。
            
            今日行程：
            ${JSON.stringify(schedules)}`;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + geminiApiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.7 }
                    })
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let resultHTML = data.candidates[0].content.parts[0].text;
                // 去除可能夾帶的 markdown html 標籤
                resultHTML = resultHTML.replace(/```html\n?/g, '').replace(/```\n?/g, '');
                
                contentDiv.innerHTML = `
                    <div class="animate-[fadeIn_0.5s_ease-out]">
                        ${resultHTML}
                    </div>
                `;
            } catch (e) {
                console.error("AI 導遊錯誤:", e);
                // 喵尼智能備用機制 (避免出遊掃興)
                contentDiv.innerHTML = `
                    <div class="text-center mt-2 animate-[fadeIn_0.5s_ease-out]">
                        <div class="flex items-center justify-center gap-1.5 text-dustypink-600 font-bold mb-3 text-[14px]">
                            哎呀！喵尼的對講機收不到訊號 📡
                        </div>
                        <div class="text-[12px] text-gray-500 leading-relaxed text-left bg-white p-3 rounded-xl border border-dustypink-100 shadow-sm mb-4">
                            系統攔截原因：<br><span class="text-dustypink-400 font-mono text-[10px] break-all">${e.message || 'API 連線阻擋'}</span>
                        </div>
                        <h4 class="font-bold text-dustypink-700 text-left mb-2 border-b border-dustypink-100 pb-1">🐱 喵尼的私房推薦 (備用庫)</h4>
                        <ul class="text-left text-[13px] text-gray-700 space-y-2">
                            <li><b class="text-dustypink-600">🥘 必吃美食：</b>建興酒家咖哩螃蟹、紅大哥水門雞飯、JODD FAIRS 火山排骨。</li>
                            <li><b class="text-dustypink-600">🛍️ 必買伴手禮：</b>BKK 泰式手標紅茶包、皇家蜂蜜、大哥花生豆。</li>
                            <li><b class="text-dustypink-600">💡 喵尼貼心提醒：</b>泰國天氣炎熱，記得隨時補充水分，搭嘟嘟車記得先講好價格喔！</li>
                        </ul>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
